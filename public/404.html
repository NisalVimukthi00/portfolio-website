<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting…</title>
    <meta name="robots" content="noindex" />
    <script>
      /*
       * Safety net for GitHub Pages.
       *
       * The app uses hash routing (/#/projects/nebula-analytics), so deep links
       * already work on Pages without any server rewrites. This file only
       * matters if you later switch to BrowserRouter: Pages serves this page
       * for unknown paths, and the script below rewrites the path into a hash
       * route so the SPA can take over.
       */
      (function () {
        var path = window.location.pathname.replace(/\/index\.html$/, "");
        var segments = path.split("/").filter(Boolean);
        // Drop the repository segment (e.g. /portfolio-website/...) when present.
        if (segments.length && !segments[0].includes(".")) segments.shift();
        var hashPath = "/" + segments.join("/");
        window.location.replace(
          window.location.origin + "/" + window.location.pathname.split("/").filter(Boolean)[0] +
            "/#" + hashPath + window.location.search
        );
      })();
    </script>
  </head>
  <body style="margin: 0; background: #05070c; color: #e8edf5; font-family: system-ui, sans-serif">
    <p style="padding: 3rem">Redirecting…</p>
  </body>
</html>
